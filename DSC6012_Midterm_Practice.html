<script>const bank=[{"id": "M01", "type": "mc", "topic": "Stationarity", "prompt": "关于 weak stationarity，下列哪一项是必要条件？", "options": ["E(X_t) 可随 t 线性变化", "E(X_t)=μ 且不依赖 t", "所有 X_t 必须独立", "必须服从正态分布"], "answer": [1], "multi": false, "explanation": "弱平稳要求均值恒定，autocovariance 只依赖 lag。"}, {"id": "M02", "type": "mc", "topic": "Stationarity", "prompt": "【多选】若 {X_t} weakly stationary，则必然成立的是？", "options": ["Var(X_t) 不依赖 t", "γ(h)=γ(−h)", "所有非零 lag 的 γ(h)=0", "γ(0)≥0"], "answer": [0, 1, 3], "multi": true, "explanation": "stationary 不要求非零 lag covariance 为 0。"}, {"id": "M03", "type": "mc", "topic": "White Noise", "prompt": "white noise 的 theoretical ACF 在 h≠0 时为？", "options": ["1", "−1", "0", "取决于 t"], "answer": [2], "multi": false, "explanation": ""}, {"id": "M04", "type": "mc", "topic": "ACF/PACF", "prompt": "AR(p) 的典型 ACF/PACF pattern 是？", "options": ["ACF p 后截尾，PACF 拖尾", "ACF 拖尾，PACF p 后截尾", "两者都 p 后截尾", "两者都恒为 0"], "answer": [1], "multi": false, "explanation": ""}, {"id": "M05", "type": "mc", "topic": "ACF/PACF", "prompt": "MA(q) 的典型 pattern 是？", "options": ["ACF q 后截尾，PACF 拖尾", "ACF 拖尾，PACF q 后截尾", "两者都拖尾", "两者都截尾"], "answer": [0], "multi": false, "explanation": ""}, {"id": "M06", "type": "mc", "topic": "ACF/PACF", "prompt": "ARMA(p,q) 最常见的 ACF/PACF pattern 是？", "options": ["ACF 截尾、PACF 拖尾", "ACF 拖尾、PACF 截尾", "两者都拖尾", "两者都截尾"], "answer": [2], "multi": false, "explanation": ""}, {"id": "M07", "type": "mc", "topic": "PACF", "prompt": "PACF(h) 的核心含义是？", "options": ["X_t 与 X_{t-h} 的 covariance", "去除中间 lags 线性影响后的直接相关", "只适用于 MA 模型", "样本方差的标准化"], "answer": [1], "multi": false, "explanation": ""}, {"id": "M08", "type": "mc", "topic": "Backshift", "prompt": "B²X_t 等于？", "options": ["X_{t+2}", "X_{t−2}", "2X_{t−1}", "X_t−X_{t−2}"], "answer": [1], "multi": false, "explanation": ""}, {"id": "M09", "type": "mc", "topic": "AR", "prompt": "AR(1): X_t=φX_{t−1}+w_t 的 stationary/causal 条件是？", "options": ["|φ|<1", "|φ|>1", "φ=1", "φ=0 才可以"], "answer": [0], "multi": false, "explanation": ""}, {"id": "M10", "type": "mc", "topic": "Roots", "prompt": "AR(p) causal 的 root 条件是？", "options": ["所有 roots 在单位圆内", "至少一个 root 在单位圆外", "所有 roots 的 modulus >1", "roots 必须为实数"], "answer": [2], "multi": false, "explanation": ""}, {"id": "M11", "type": "mc", "topic": "Invertibility", "prompt": "MA(q) invertible 的 root 条件是？", "options": ["MA polynomial roots modulus >1", "AR polynomial roots modulus >1", "θ_j 全部为正", "ACF 必须拖尾"], "answer": [0], "multi": false, "explanation": ""}, {"id": "M12", "type": "mc", "topic": "ARMA", "prompt": "【多选】ARMA(p,q) 判断时应检查哪些？", "options": ["AR polynomial roots", "MA polynomial roots", "AR 与 MA polynomial 是否有 common factor", "是否每个 observation 独立"], "answer": [0, 1, 2], "multi": true, "explanation": ""}, {"id": "M13", "type": "mc", "topic": "Differencing", "prompt": "若 X_t=β₁+β₂t+w_t，β₂≠0，则 X_t non-stationary 的最直接原因是？", "options": ["variance 为 0", "mean 随 t 改变", "white noise 不独立", "ACF 恒为 1"], "answer": [1], "multi": false, "explanation": ""}, {"id": "M14", "type": "mc", "topic": "Differencing", "prompt": "对 X_t=β₁+β₂t+w_t 做一阶差分后得到？", "options": ["β₁+β₂+w_t", "β₂+w_t−w_{t−1}", "β₂t+w_t−w_{t−1}", "w_t"], "answer": [1], "multi": false, "explanation": ""}, {"id": "M15", "type": "mc", "topic": "Autocovariance", "prompt": "γ(0) 等于？", "options": ["E(X_t)", "Var(X_t)", "Corr(X_t,X_{t+1})", "0"], "answer": [1], "multi": false, "explanation": ""}, {"id": "M16", "type": "mc", "topic": "Autocovariance", "prompt": "【多选】autocovariance 的基本性质包括？", "options": ["γ(0)≥0", "|γ(h)|≤γ(0)", "γ(h)=γ(−h)", "γ(h)=0 对所有 h≠0"], "answer": [0, 1, 2], "multi": true, "explanation": ""}, {"id": "M17", "type": "mc", "topic": "Sampling", "prompt": "样本量 n 较大时，white-noise sample ACF 常用的约 95% bounds 是？", "options": ["±1/n", "±1.96/√n", "±√n", "±1.96n"], "answer": [1], "multi": false, "explanation": ""}, {"id": "M18", "type": "mc", "topic": "MA", "prompt": "MA(1): X_t=w_t+θw_{t−1}，理论 γ(h) 在 |h|>1 时？", "options": ["θσ²", "σ²", "0", "不确定"], "answer": [2], "multi": false, "explanation": ""}, {"id": "M19", "type": "mc", "topic": "MA", "prompt": "MA(1) 的 γ(0) 是？", "options": ["σ_w²", "(1+θ²)σ_w²", "θσ_w²", "(1−θ²)σ_w²"], "answer": [1], "multi": false, "explanation": ""}, {"id": "M20", "type": "mc", "topic": "Model identification", "prompt": "看到 ACF 在 lag 2 后明显 cutoff、PACF gradual decay，最优先考虑？", "options": ["AR(2)", "MA(2)", "ARMA(2,2)", "white noise"], "answer": [1], "multi": false, "explanation": ""}, {"id": "M21", "type": "mc", "topic": "Model identification", "prompt": "看到 PACF 在 lag 3 后 cutoff、ACF gradual decay，最优先考虑？", "options": ["AR(3)", "MA(3)", "ARMA(1,1)", "random walk"], "answer": [0], "multi": false, "explanation": ""}, {"id": "M22", "type": "mc", "topic": "Redundancy", "prompt": "若 φ(B)=(1−0.5B)(1−0.3B)，θ(B)=1−0.3B，则最低阶模型是？", "options": ["ARMA(2,1)", "AR(1)", "MA(1)", "AR(2)"], "answer": [1], "multi": false, "explanation": ""}, {"id": "M23", "type": "mc", "topic": "Forecasting", "prompt": "BLP 的 orthogonality principle 表示？", "options": ["预测值必须等于真实值", "prediction error 与所有 predictor 不相关", "prediction error 的 mean 必须为 1", "只允许使用一个 lag"], "answer": [1], "multi": false, "explanation": ""}, {"id": "M24", "type": "mc", "topic": "Forecasting", "prompt": "在平方损失下，conditional expectation 的重要性质是？", "options": ["最大化 variance", "最小化 MSE", "保证 zero error", "保证 invertibility"], "answer": [1], "multi": false, "explanation": ""}, {"id": "M25", "type": "mc", "topic": "Concept", "prompt": "【多选】下列哪些现象提示 non-stationarity？", "options": ["明显 deterministic trend", "均值随时间移动", "variance 随时间明显扩大", "ACF 在 lag 1 非零"], "answer": [0, 1, 2], "multi": true, "explanation": ""}, {"id": "M26", "type": "mc", "topic": "White Noise", "prompt": "【多选】white noise 一定满足？", "options": ["zero mean（课程定义）", "constant finite variance", "不同时间点 uncorrelated", "每个点一定 Gaussian"], "answer": [0, 1, 2], "multi": true, "explanation": ""}, {"id": "M27", "type": "mc", "topic": "AR", "prompt": "AR(1) 若 φ=−0.7，其 ACF 最典型的形状是？", "options": ["恒为正且不衰减", "正负交替并指数衰减", "lag1 后完全为0", "线性上升"], "answer": [1], "multi": false, "explanation": ""}, {"id": "M28", "type": "mc", "topic": "Roots", "prompt": "AR(2) 的 characteristic root 恰好落在单位圆上，最合理判断是？", "options": ["稳定 stationary", "可能 unit-root / non-stationary boundary", "一定 invertible", "一定 white noise"], "answer": [1], "multi": false, "explanation": ""}, {"id": "M29", "type": "mc", "topic": "ARMA", "prompt": "【多选】关于 ARMA(p,q) 正确的是？", "options": ["AR 部分刻画 past states", "MA 部分刻画 current/past shocks", "p 是 MA order", "q 是 MA order"], "answer": [0, 1, 3], "multi": true, "explanation": ""}, {"id": "M30", "type": "mc", "topic": "Exam scope", "prompt": "本次期中按你的范围说明，哪一部分不作为复习重点/题库内容？", "options": ["PACF", "AR roots", "ARMA → MA(∞) 展开", "Invertibility"], "answer": [2], "multi": false, "explanation": ""}, {"id": "T01", "type": "tf", "topic": "Stationarity", "prompt": "只要 Cov(X_t,X_{t+h}) 不为 0，序列就一定 non-stationary。", "answer": false, "explanation": "stationary 可以具有非零 autocovariance，只需其只依赖 lag。"}, {"id": "T02", "type": "tf", "topic": "Stationarity", "prompt": "Weak stationarity 的 covariance condition 已经包含 constant variance，因为 Var(X_t)=γ(0)。", "answer": true, "explanation": ""}, {"id": "T03", "type": "tf", "topic": "White Noise", "prompt": "Gaussian white noise 是 white noise 的一个特殊情况。", "answer": true, "explanation": ""}, {"id": "T04", "type": "tf", "topic": "ACF/PACF", "prompt": "AR(p) 的 ACF 在 lag p 后理论上严格为 0。", "answer": false, "explanation": "AR 的 ACF 通常 tails off，PACF 才在 p 后截尾。"}, {"id": "T05", "type": "tf", "topic": "MA", "prompt": "MA(q) 的 theoretical ACF 在 |h|>q 时为 0。", "answer": true, "explanation": ""}, {"id": "T06", "type": "tf", "topic": "Roots", "prompt": "AR roots 全在单位圆外是 causality 的条件。", "answer": true, "explanation": ""}, {"id": "T07", "type": "tf", "topic": "Invertibility", "prompt": "MA polynomial 有 root 位于 |z|=1 时仍然 invertible。", "answer": false, "explanation": ""}, {"id": "T08", "type": "tf", "topic": "PACF", "prompt": "PACF 会去除中间 lags 的线性影响。", "answer": true, "explanation": ""}, {"id": "T09", "type": "tf", "topic": "Sampling", "prompt": "样本 ACF 图中只要有一个柱超过 95% band，就能 100% 确定该 lag 存在真实相关。", "answer": false, "explanation": ""}, {"id": "T10", "type": "tf", "topic": "Redundancy", "prompt": "AR 与 MA polynomial 有共同因子时，应先约掉共同因子再确定最低阶模型。", "answer": true, "explanation": ""}, {"id": "S01", "type": "short", "topic": "Stationarity", "prompt": "设 X_t=β₁+β₂t+w_t，w_t 为 white noise。判断 X_t 是否 stationary，并证明 Y_t=X_t−X_{t−1} 是否 stationary。", "answer": "X_t: E(X_t)=β₁+β₂t，若 β₂≠0 随 t 改变，因此 non-stationary。Y_t=β₂+w_t−w_{t−1}。E(Y_t)=β₂；γ_Y(0)=2σ_w²；γ_Y(±1)=−σ_w²；|h|>1 时为0，均只依赖 lag，因此 Y_t weakly stationary。"}, {"id": "S02", "type": "short", "topic": "Autocovariance", "prompt": "w_t 为 normal white noise，X_t=w_t w_{t−1}。求 mean、autocovariance 并判断 stationarity。", "answer": "E(X_t)=E(w_t)E(w_{t−1})=0。γ(0)=E(w_t²)E(w_{t−1}²)=σ_w⁴。h≠0 时乘积中至少有独立的零均值 white-noise 因子，期望为0，因此 γ(h)=0。mean 常数且 γ 只依赖 h，所以 weakly stationary。"}, {"id": "S03", "type": "short", "topic": "AR", "prompt": "对 AR(2): X_t=−0.9X_{t−2}+w_t，求 characteristic roots，判断 causality，并描述 ACF。", "answer": "φ(z)=1+0.9z²=0 ⇒ z=±i/√0.9，|z|≈1.054>1，所以 causal/stationary。Yule-Walker 给 ρ(1)=0，且 ρ(h)=−0.9ρ(h−2)。因此所有奇数 lag 为0，偶数 lag 交替正负并以 0.9 的幂衰减。"}, {"id": "S04", "type": "short", "topic": "ARMA", "prompt": "将 X_t=0.80X_{t−1}−0.15X_{t−2}+w_t−0.30w_{t−1} 识别为最低阶 ARMA，并判断 causal/invertible。", "answer": "AR polynomial 1−0.8B+0.15B²=(1−0.5B)(1−0.3B)，MA polynomial=1−0.3B。约 common factor 后：(1−0.5B)X_t=w_t，即 AR(1)。AR root=2>1，causal。约简后无 MA 部分，invertibility 不再是限制。"}, {"id": "S05", "type": "short", "topic": "ARMA", "prompt": "分析 X_t=X_{t−1}−0.5X_{t−2}+w_t−w_{t−1} 的 ARMA 阶数、causality、invertibility。", "answer": "φ(B)=1−B+0.5B²，θ(B)=1−B，无 common factor，因此 ARMA(2,1)。AR roots 为 1±i，modulus=√2>1 ⇒ causal。MA root=1，位于单位圆上 ⇒ not invertible。"}, {"id": "S06", "type": "short", "topic": "ACF/PACF", "prompt": "解释为什么 AR(p) 的 PACF 在 lag p 后截尾，而 ACF 通常仍然拖尾。", "answer": "AR(p) 的 X_t 直接由最近 p 个过去值决定。对 lag>p，X_t 与更远过去的相关可通过中间 lags 传递，因此 ACF 仍可能非零；PACF 控制这些中间 lags 后，没有额外直接线性关系，所以理论 PACF=0。"}, {"id": "S07", "type": "short", "topic": "MA", "prompt": "推导 MA(1): X_t=w_t+θw_{t−1} 的 γ(0), γ(1), γ(h>1)。", "answer": "γ(0)=Var(w_t)+θ²Var(w_{t−1})=(1+θ²)σ_w²。γ(1) 只保留共享 w_t 项，等于 θσ_w²。|h|>1 时两个变量不共享同一 white-noise shock，covariance=0。"}, {"id": "S08", "type": "short", "topic": "Stationarity", "prompt": "为什么“相隔 1 天的数据 covariance 不因发生在 January 还是 June 改变”是 weak stationarity 的核心直觉？", "answer": "因为 weak stationarity 要求 Cov(X_t,X_{t+h}) 只由 lag h 决定，不由绝对时间 t 决定。所有 lag=1 的 pair 必须具有同一个 γ(1)。"}, {"id": "S09", "type": "short", "topic": "Forecasting", "prompt": "解释 BLP 的 orthogonality principle，并说明为什么它对应最小 MSE。", "answer": "最优线性预测下，prediction error 与所有 predictor covariance 为0。如果 error 仍与某个 predictor 相关，就可调整该 predictor 的系数进一步降低平方误差，因此当前预测还不是最优。"}, {"id": "S10", "type": "short", "topic": "Model identification", "prompt": "给出使用 ACF/PACF 初步识别 AR、MA、ARMA 的流程，并说明有限样本为什么不能机械地把小柱当作理论非零。", "answer": "先确认 stationarity；AR(p): ACF tail off/PACF cutoff p；MA(q): ACF cutoff q/PACF tail off；ARMA: 两者 tail off。样本 ACF/PACF 有 sampling variability，理论为0的 lag 也会出现小的非零估计，要结合 confidence bands 和整体 pattern。"}, {"id": "S11", "type": "short", "topic": "Differencing", "prompt": "解释 first differencing 与 seasonal differencing 的差异。", "answer": "First difference X_t−X_{t−1} 主要处理逐期 trend/unit-root 型变化；seasonal difference X_t−X_{t−s} 比较同一季节位置，用于去除 period=s 的重复季节效应。"}, {"id": "S12", "type": "short", "topic": "Roots", "prompt": "用自己的话区分 causality 和 invertibility。", "answer": "Causality：当前 X_t 能稳定地由现在/过去 white-noise shocks 生成，检查 AR roots。Invertibility：当前 innovation w_t 能稳定地从现在/过去观测 X 恢复，检查 MA roots。两者都以 roots 在单位圆外作为对应条件。"}];let current=[];let shortScores={};
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function newExam(){shortScores={};let mc=shuffle(bank.filter(q=>q.type==='mc')).slice(0,5);let tf=shuffle(bank.filter(q=>q.type==='tf')).slice(0,2);let sh=shuffle(bank.filter(q=>q.type==='short')).slice(0,3);current=[...mc,...tf,...sh];render();document.getElementById('score').innerHTML='';window.scrollTo(0,0)}
function render(){let h='';current.forEach((q,i)=>{h+=`<div class="q" id="q-${q.id}"><div class="qtitle">${i+1}. ${q.multi?'【多选】 ':''}${q.prompt} <span class="pill">${q.topic}</span></div>`;if(q.type==='mc'){q.options.forEach((o,j)=>h+=`<label class="opt"><input type="${q.multi?'checkbox':'radio'}" name="${q.id}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`);}else if(q.type==='tf'){h+=`<label class="opt"><input type="radio" name="${q.id}" value="true"> 正确</label><label class="opt"><input type="radio" name="${q.id}" value="false"> 错误</label>`;}else{h+=`<textarea placeholder="先自己写推导/解释，再展开参考答案"></textarea><button class="btn light" onclick="toggleAns('${q.id}')">显示/隐藏参考答案</button><div class="answer" id="a-${q.id}"><b>参考答案：</b>${q.answer}<div class="selfscore">自评：<button class="btn light" onclick="self('${q.id}',0)">0</button><button class="btn light" onclick="self('${q.id}',0.5)">0.5</button><button class="btn light" onclick="self('${q.id}',1)">1</button> <span id="ss-${q.id}"></span></div></div>`;}h+='</div>';});document.getElementById('exam').innerHTML=h;}
function toggleAns(id){let x=document.getElementById('a-'+id);x.style.display=x.style.display==='block'?'none':'block'}function self(id,v){shortScores[id]=v;document.getElementById('ss-'+id).textContent='已记 '+v+' 分';}
function submitExam(){let total=0,max=0,wrong=JSON.parse(localStorage.getItem('ts-wrong')||'[]');current.forEach(q=>{let el=document.getElementById('q-'+q.id);el.classList.remove('wrong','correct');if(q.type==='mc'){max+=1;let vals=[...document.querySelectorAll(`input[name="${q.id}"]:checked`)].map(x=>+x.value);let ans=q.answer;let score=0;if(q.multi){let bad=vals.some(v=>!ans.includes(v));score=bad?0:vals.filter(v=>ans.includes(v)).length/ans.length;}else score=(vals.length===1&&vals[0]===ans[0])?1:0;total+=score;if(score===1)el.classList.add('correct');else{el.classList.add('wrong');wrong.push(q.id)}let info=document.createElement('div');info.className='note';info.innerHTML=`得分 ${score.toFixed(2)}/1；正确答案：${ans.map(v=>String.fromCharCode(65+v)).join(', ')}。 ${q.explanation||''}`;el.appendChild(info);}else if(q.type==='tf'){max+=1;let x=document.querySelector(`input[name="${q.id}"]:checked`);let ok=x&&((x.value==='true')===q.answer);total+=ok?1:0;el.classList.add(ok?'correct':'wrong');if(!ok)wrong.push(q.id);let info=document.createElement('div');info.className='note';info.textContent=`正确答案：${q.answer?'正确':'错误'}。 ${q.explanation||''}`;el.appendChild(info);}});localStorage.setItem('ts-wrong',JSON.stringify([...new Set(wrong)]));let short=current.filter(q=>q.type==='short');let ss=short.reduce((a,q)=>a+(shortScores[q.id]||0),0);max+=short.length;total+=ss;document.getElementById('score').innerHTML=`<div class="scorebox"><b>当前得分：${total.toFixed(2)} / ${max}</b><br><span style="font-size:13px">问答自评分：${ss}/${short.length}。未自评的问答按 0 分计。</span></div>`;}
function showWrong(){let ids=JSON.parse(localStorage.getItem('ts-wrong')||'[]');let qs=bank.filter(q=>ids.includes(q.id));current=qs.length?qs:[];if(!qs.length)document.getElementById('exam').innerHTML='<div class="ok">当前错题本为空。</div>';else render();}
function clearWrong(){localStorage.removeItem('ts-wrong');alert('错题本已清空')}newExam();</script></body></html>
